<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Compass Studio · Procedure workspace</title>
<meta name="description" content="A working prototype of the Ask Compass procedure workspace: follow guided procedures, edit drafts, approve changes and see how procedures are used.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/studio.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <button class="drawer-btn" id="drawerBtn" type="button" data-act="drawer" aria-expanded="false" aria-controls="side" aria-label="Show procedures">
    <span></span><span></span><span></span>
  </button>
  <a class="brand" href="index.html" aria-label="Ask Compass home">
    <img src="/assets/brand/logo-128.webp" width="32" height="32" alt="">
    <span>Ask Compass <em>Studio</em></span>
  </a>
  <form class="search" id="searchForm" role="search">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 18 18"/></svg>
    <label class="sr-only" for="searchInput">Search procedures and steps</label>
    <input id="searchInput" type="search" placeholder="Search procedures and steps" autocomplete="off">
  </form>
  <div class="top-right">
    <a class="bell" href="#/inbox" aria-label="Notifications">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <span class="count" id="bellCount" hidden>0</span>
    </a>
    <label class="role"><span>Role</span>
      <select id="roleSelect" aria-label="Demo role">
        <option value="viewer">Viewer</option>
        <option value="editor">Editor</option>
        <option value="approver">Approver</option>
        <option value="admin">Admin</option>
      </select>
    </label>
  </div>
</header>

<div class="layout">
  <aside class="side" id="side" aria-label="Workspace">
    <nav class="side-nav" aria-label="Sections">
      <a href="#/library">Library</a>
      <a href="#/approvals" id="navApprovals">Approvals <span class="count" id="approvalCount" hidden>0</span></a>
      <a href="#/inbox">Notifications</a>
      <a href="#/insights">Insights</a>
      <a href="#/audit">Audit log</a>
    </nav>
    <div class="side-procs" id="sideProcs"></div>
    <div class="side-foot">
      <p>Prototype: data is saved in this browser only. Roles are a demo switch, not sign-in.</p>
      <button class="text-btn" type="button" data-act="reset" id="resetData" hidden>Reset sample data</button>
    </div>
  </aside>
  <div class="scrim" data-act="drawer" aria-hidden="true"></div>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="assets/js/studio-data.js"></script>
<script src="assets/js/studio.js"></script>
</body>
</html>
